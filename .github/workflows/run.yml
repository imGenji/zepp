name: logn

on:
  workflow_dispatch:
  # schedule 改由 cron-job.org 外部定时触发，避免 GitHub schedule 排队延迟
  # schedule:
  #   - cron: '30 11 * * 0,2,4,5,6' # UTC 11:30 = 北京时间 19:30，跳过周一、周三
  # push:
  #   branches:
  #     - master
  #     - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
        if: env.AES_KEY != ''
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          # 检查 token 文件是否有变化
          if [ -f encrypted_tokens.data ]; then
            git add encrypted_tokens.data
            if ! git diff --staged --quiet; then
              git commit -m "persist tokens trigger by ${{ github.event_name }} [skip ci]" || true
              git push origin master || true
            fi
          fi

      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: GitHub Actions 执行成功 - mimotion
          to: 1129322026@qq.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            你好！
            
            你的 mimotion 项目在 GitHub Actions 上的定时任务已成功执行完成。
            
            查看运行日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
